services:
  db:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_USER: modelcontrol_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: modelcontrol

    volumes:
      - modelcontrol_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U modelcontrol_app -d modelcontrol"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  backend:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://modelcontrol_app:${POSTGRES_PASSWORD}@db:5432/modelcontrol
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://127.0.0.1/ || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  modelcontrol_postgres_data:
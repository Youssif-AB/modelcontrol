name: ModelControl CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests + PostgreSQL Migration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: modelcontrol_app
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: modelcontrol_ci

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U modelcontrol_app -d modelcontrol_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://modelcontrol_app:postgres@localhost:5432/modelcontrol_ci
      JWT_SECRET_KEY: modelcontrol-ci-only-secret-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Apply Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Verify migration reached head
        working-directory: backend
        run: alembic current

      - name: Run backend test suite
        working-directory: backend
        run: pytest -v


  frontend:
    name: Frontend Lint + Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  docker:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    env:
      POSTGRES_PASSWORD: docker-ci-password
      JWT_SECRET_KEY: docker-ci-only-secret-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config > /dev/null

      - name: Build and start application
        run: docker compose up -d --build

      - name: Wait for backend health
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend never became healthy"
          docker compose ps
          docker compose logs backend
          docker compose logs db
          exit 1

      - name: Wait for frontend health
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:5173 > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi

            echo "Waiting for frontend..."
            sleep 2
          done

          echo "Frontend never became ready"
          docker compose ps
          docker compose logs frontend
          exit 1

      - name: Show container status
        run: docker compose ps

      - name: Clean up containers
        if: always()
        run: docker compose down -v